name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: sigarum_test_secret_key_2024
      PORT: 3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create database directory
        run: mkdir -p database

      - name: Run tests
        run: npm test -- --forceExit --detectOpenHandles

      - name: Build check (optional)
        run: npm run build || echo "No build script defined"
