<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Blue App Icon Gradient -->
    <linearGradient id="sigarumLogoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#028ceb" />
      <stop offset="50%" stop-color="#0176d3" />
      <stop offset="100%" stop-color="#005eb8" />
    </linearGradient>

    <!-- Subtle top gloss / sheen -->
    <linearGradient id="sigarumGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Soft ambient glow shadow -->
    <filter id="sigarumShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#006ec7" flood-opacity="0.42" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#004b91" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="44" y="36" width="424" height="424" rx="104" ry="104" fill="url(#sigarumLogoGrad)" filter="url(#sigarumShadow)" />
  <rect x="44" y="36" width="424" height="200" rx="104" ry="104" fill="url(#sigarumGloss)" />

  <!-- Globe Vector Art -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Globe Circle -->
    <circle cx="256" cy="248" r="118" />

    <!-- Left Continent Wave (Organic coastline contour) -->
    <path d="M 166 202 C 190 208, 206 226, 196 250 C 186 274, 172 286, 182 310 C 192 330, 204 338, 214 345" />

    <!-- Top / Center / Right Continent (Organic coastline contour) -->
    <path d="M 268 135 C 265 168, 235 180, 238 206 C 242 228, 266 232, 288 220 C 312 208, 324 235, 314 262 C 308 278, 292 295, 272 305" />

    <!-- Bottom Center Contour -->
    <path d="M 242 355 C 248 338, 260 334, 268 351" />

    <!-- Bottom Right Contour Arc -->
    <path d="M 322 318 C 342 322, 354 308, 360 288" />
  </g>
</svg>
